name: Tests

on:
  push:
  pull_request:

# A superseded run on the same ref proves nothing; let the newest push win.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Same image as docker-compose.yml so CI and a laptop disagree about as
      # little as possible. The credentials below are not a secret: this
      # container is created for the job, reachable only from it, and destroyed
      # with it. A real DATABASE_URL must never appear in this file.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskara
          POSTGRES_PASSWORD: taskara
          POSTGRES_DB: taskara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskara -d taskara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://taskara:taskara@localhost:5432/taskara_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Pinned, not `latest`: a gate whose toolchain moves underneath it can go
      # red for reasons that have nothing to do with the diff, and — worse — go
      # green on a runtime nobody develops against.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      # `migrate deploy`, never `db push`. The effort and agent invariants are
      # Postgres CHECK constraints that live in migration SQL and cannot be
      # expressed in schema.prisma, so a db-push bootstrap yields the columns
      # with none of the enforcement — and the guard tests below would then be
      # asserting against a database that is quietly missing the thing they
      # guard. Deploying from zero also keeps the migration history honest.
      - name: Apply migrations
        run: bun prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Shared package tests
        run: bun test packages/shared

      # A bare directory, not a glob: `bun run` executes scripts through the
      # system shell, which has no globstar, so a pattern like
      # `apps/web/**/*.test.ts` would quietly cover one directory level and
      # report green for the rest. Bun's own recursive discovery has no such
      # blind spot, so every future web test file is gated without anyone
      # remembering to widen a pattern. The Playwright specs stay out because
      # they are named `.e2e.ts`, which Bun does not recognise as a test.
      - name: Web tests
        run: bun run test:web

      # Runs before typecheck deliberately: Bun executes TypeScript without
      # checking it, so a type error rarely stops the suite. Tests first means
      # one run reports both.
      - name: API tests
        run: bun run test:api

      - name: Typecheck
        run: bun run typecheck
